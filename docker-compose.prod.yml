services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phrasefluency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phrasefluency}
      POSTGRES_DB: ${POSTGRES_DB:-phrasefluency}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phrasefluency}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-phrasefluency}:${POSTGRES_PASSWORD:-phrasefluency}@postgres:5432/${POSTGRES_DB:-phrasefluency}
      SESSION_SECRET: ${SESSION_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      FRONTEND_URL: ${FRONTEND_URL:-https://phrasefluency.aebouel.org}
      ADDITIONAL_CORS_ORIGINS: ${ADDITIONAL_CORS_ORIGINS:-}
      API_BASE_URL: ${API_BASE_URL:-https://phrasefluency.aebouel.org}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD}
      TTS_VOICE: ${TTS_VOICE:-alloy}
      AUDIO_STORAGE_PATH: /data/audio
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - audio_data:/data/audio
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"

  frontend-build:
    build:
      context: ./frontend
      target: build
    volumes:
      - frontend_dist:/output

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-phrasefluency.aebouel.org}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./ssl/phrasefluency:/certs:ro
      - frontend_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully

volumes:
  postgres_data:
  audio_data:
  caddy_data:
  caddy_config:
  frontend_dist:
